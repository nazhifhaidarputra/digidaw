name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build_and_test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libjack-jackd2-dev libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install Flutter Dependencies
        run: flutter pub get

      # RUST CHECKS
      - name: Check Rust Formatting
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Rust Clippy (Linter)
        working-directory: rust
        run: cargo clippy

      - name: Run Rust Tests
        working-directory: rust
        run: cargo test

      # FLUTTER CHECKS
      - name: Flutter Analyze
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test
