name: CI

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.6"
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux build and test
    # Same base as release.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # build_linux.sh installs the build packages itself but refuses to run without an audio server.
      # The runner's DNS and the Ubuntu mirrors fail now and then, so apt retries each download
      # (build_linux.sh's apt-get too, through the config file) and the install is tried three times.
      - name: Install PipeWire
        timeout-minutes: 15
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends pipewire; then
              exit 0
            fi
            echo "::warning::Installing PipeWire failed (attempt ${attempt} of 3); retrying in 60 s"
            sleep 60
          done
          exit 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Also installs the apt packages the tests below link against.
      - name: Build Linux release bundle
        run: ./scripts/builder/build_linux.sh

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Check for unused Rust dependencies
        run: cargo machete
        working-directory: rust

      - name: Rust tests
        working-directory: rust
        run: cargo test --workspace --locked

      - name: Flutter tests
        run: flutter test
