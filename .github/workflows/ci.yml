name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.6"
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux build and test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      # build_linux.sh installs the build packages itself but refuses to run without an audio server.
      - name: Install PipeWire
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pipewire

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Also installs the apt packages the tests below link against.
      - name: Build Linux release bundle
        run: ./scripts/builder/build_linux.sh

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Check for unused Rust dependencies
        run: cargo machete
        working-directory: rust

      - name: Rust tests
        working-directory: rust
        run: cargo test --workspace --locked

      - name: Flutter tests
        run: flutter test
