name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build_and_release:
    name: Build & Release (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            flutter_target: linux
            output_path: build/linux/x64/release/bundle
            archive_name: karbeat-linux-x64.tar.gz
            asset_content_type: application/gzip
          - os: windows-latest
            os_name: windows
            flutter_target: windows
            output_path: build/windows/x64/runner/Release
            archive_name: karbeat-windows-x64.zip
            asset_content_type: application/zip
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libjack-jackd2-dev libasound2-dev
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Enable Flutter desktop
        run: flutter config --enable-${{ matrix.flutter_target }}-desktop
        
      - name: Flutter doctor
        run: flutter doctor -v
        
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Flutter build
        run: flutter build ${{ matrix.flutter_target }} --release
        
      - name: Create archive (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd ${{ matrix.output_path }}
          tar -czvf ../../../../../${{ matrix.archive_name }} *
          
      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd ${{ matrix.output_path }}
          Compress-Archive -Path * -DestinationPath ..\..\..\..\..\${{ matrix.archive_name }}
          
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
