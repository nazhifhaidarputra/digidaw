name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build_and_release:
    name: Build & Release (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            flutter_target: linux
            output_path: build/linux/x64/release/bundle
            archive_name: karbeat-linux-x64.tar.gz
            
          - os: windows-latest
            os_name: windows
            flutter_target: windows
            output_path: build/windows/x64/runner/Release
            archive_name: karbeat-windows-x64.zip
            
          - os: ubuntu-latest
            os_name: android
            flutter_target: apk
            output_path: build/app/outputs/flutter-apk/app-release.apk
            archive_name: karbeat-android.apk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libjack-jackd2-dev libasound2-dev

      - name: Setup Java (For Android)
        if: matrix.os_name == 'android'
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Android Rust Targets
        if: matrix.os_name == 'android'
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Flutter desktop
        if: matrix.os_name != 'android'
        run: flutter config --enable-${{ matrix.flutter_target }}-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Flutter build
        run: flutter build ${{ matrix.flutter_target }} --release

      - name: Create archive (Linux)
        if: matrix.os_name == 'linux'
        run: |
          cd ${{ matrix.output_path }}
          tar -czvf ../../../../../${{ matrix.archive_name }} *

      - name: Create archive (Windows)
        if: matrix.os_name == 'windows'
        run: |
          cd ${{ matrix.output_path }}
          Compress-Archive -Path * -DestinationPath ..\..\..\..\..\${{ matrix.archive_name }}

      - name: Prepare APK (Android)
        if: matrix.os_name == 'android'
        run: |
          cp ${{ matrix.output_path }} ./${{ matrix.archive_name }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}