name: Release

# Publishes a GitHub release for a version tag, e.g. `git tag v0.6.0 && git push github v0.6.0`.
# Only Linux x64 is built: it is the only platform that has been tested so far.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.6.0)"
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.6"
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    name: Linux x64 release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Check tag matches project version
        id: version
        run: |
          version="$(sed -n 's/^version: *\([^ +]*\).*/\1/p' pubspec.yaml)"
          if [ "v${version}" != "${RELEASE_TAG}" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match pubspec.yaml version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          case "${version}" in
            0.*|*-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # build_linux.sh installs the build packages itself but refuses to run without an audio server.
      - name: Install PipeWire
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pipewire

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build Linux release bundle
        run: ./scripts/builder/build_linux.sh

      - name: Name and checksum archive
        id: package
        run: |
          archive="dist/digidaw-${{ steps.version.outputs.version }}-linux-x64.tar.gz"
          mv dist/Digidaw-linux-x64.tar.gz "${archive}"
          (cd dist && sha256sum "$(basename "${archive}")" > "$(basename "${archive}").sha256")
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          cat > dist/NOTES.md <<'EOF'
          Linux x64 only — other platforms have not been tested yet.

          ### Installing
          Extract the archive into a folder and run `./install.sh` from it. It installs the
          libraries DigiDAW needs (GTK 3, ALSA, FFTW, libsamplerate) with your package manager,
          then adds DigiDAW to your app menu and a `digidaw` command.

          To remove it, run `~/.local/share/digidaw/uninstall.sh` (or `./uninstall.sh` from the
          archive). Add `--purge` to also delete settings and crash recovery data.

          PipeWire (with its JACK compatibility layer) or JACK is recommended for low-latency audio.

          Built on Ubuntu 26.04, so older distributions may not be able to run it.
          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: DigiDAW ${{ env.RELEASE_TAG }}
          body_path: dist/NOTES.md
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
