# .deb and .rpm packages of the Linux release bundle, built by package_linux.sh with nfpm.
# package_linux.sh sets the DIGIDAW_* variables. nfpm expands them in the version and the
# dependencies, but in a content path only when the entry has `expand: true`.
#
# The app goes to /opt/digidaw with a `digidaw` command in /usr/bin and a menu entry. The
# packages require the shared libraries install.sh installs: GTK 3, ALSA, FFTW, libsamplerate
# and lilv (Rubber Band is linked into the app), and the glibc the build machine had.
name: digidaw
arch: amd64
platform: linux
version: ${DIGIDAW_VERSION}
version_schema: semver
release: 1
section: sound
priority: optional
maintainer: DigiDAW developers
description: |-
  Digital audio workstation.
  Records and arranges audio and MIDI, and hosts VST3, CLAP and LV2 plugins.
vendor: DigiDAW
homepage: https://github.com/nazhifhaidarputra/digidaw
license: GPL-3.0-only

contents:
  - src: ${DIGIDAW_STAGE}/app/
    dst: /opt/digidaw
    type: tree
    expand: true
  - src: /opt/digidaw/karbeat
    dst: /usr/bin/digidaw
    type: symlink
  # Named after the application ID, which the app's windows report, so desktops match
  # them to this entry and its icon.
  - src: ${DIGIDAW_RESOURCES}/app.digidaw.Digidaw.desktop
    dst: /usr/share/applications/app.digidaw.Digidaw.desktop
    expand: true
  - src: ${DIGIDAW_STAGE}/app/data/app_icon.png
    dst: /usr/share/icons/hicolor/256x256/apps/app.digidaw.Digidaw.png
    expand: true

overrides:
  deb:
    depends:
      - libc6 (>= ${DIGIDAW_GLIBC})
      # GTK 3 and ALSA were renamed for the 64-bit time_t transition in Ubuntu 24.04+ and
      # Debian 13+.
      - libgtk-3-0t64 | libgtk-3-0
      - libasound2t64 | libasound2
      - libfftw3-double3
      - libsamplerate0
      - liblilv-0-0
  rpm:
    # Library capabilities rather than package names, which differ between Fedora and openSUSE.
    depends:
      - libc.so.6(GLIBC_${DIGIDAW_GLIBC})(64bit)
      - libgtk-3.so.0()(64bit)
      - libasound.so.2()(64bit)
      - libfftw3.so.3()(64bit)
      - libsamplerate.so.0()(64bit)
      - liblilv-0.so.0()(64bit)
