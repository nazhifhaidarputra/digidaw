[package]
name = "karbeat-lv2"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-only"
description = "LV2 host implementation for DigiDAW external plugin hosting"

[dependencies]
karbeat-host-api.workspace = true

# lilv is resolved through pkg-config, which only the Linux build environment provides.
[target.'cfg(target_os = "linux")'.dependencies]
karbeat-plugin-api.workspace = true
karbeat-utils.workspace = true
lilv = "0.2.4"
lilv-sys = "0.2.1"
lv2-sys = "2.0.0"
libloading.workspace = true
log.workspace = true
raw-window-handle.workspace = true
rtrb.workspace = true
tokio.workspace = true
x11rb.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
futures-lite.workspace = true
glib.workspace = true

[lints]
workspace = true

[[test]]
name = "lsp"
harness = false

[[test]]
name = "mda"
harness = false

